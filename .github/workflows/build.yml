name: Android CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407

      - name: Install pinned Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Run repository contracts
        run: python3 -m unittest discover -s tests -v

      - name: Test, lint, and build debug APK
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Restore release signing key
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          TCH_KEYSTORE_B64: ${{ secrets.TCH_KEYSTORE_B64 }}
          TCH_STORE_PASSWORD: ${{ secrets.TCH_STORE_PASSWORD }}
          TCH_KEY_ALIAS: ${{ secrets.TCH_KEY_ALIAS }}
          TCH_KEY_PASSWORD: ${{ secrets.TCH_KEY_PASSWORD }}
        run: |
          test -n "$TCH_KEYSTORE_B64"
          test -n "$TCH_STORE_PASSWORD"
          test -n "$TCH_KEY_ALIAS"
          test -n "$TCH_KEY_PASSWORD"
          printf '%s' "$TCH_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.p12"
          echo "TCH_KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Test, lint, and build signed release APK
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          TCH_STORE_PASSWORD: ${{ secrets.TCH_STORE_PASSWORD }}
          TCH_KEY_ALIAS: ${{ secrets.TCH_KEY_ALIAS }}
          TCH_KEY_PASSWORD: ${{ secrets.TCH_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testReleaseUnitTest lintRelease assembleRelease

      - name: Verify reproducibility, signature, and APK contents
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          TCH_STORE_PASSWORD: ${{ secrets.TCH_STORE_PASSWORD }}
          TCH_KEY_ALIAS: ${{ secrets.TCH_KEY_ALIAS }}
          TCH_KEY_PASSWORD: ${{ secrets.TCH_KEY_PASSWORD }}
        run: |
          ./scripts/verify-reproducible-build.sh
          ./scripts/verify-release-apk.sh

      - name: Stage release APK
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          mkdir -p release-apk
          cp app/build/outputs/apk/release/app-release.apk "release-apk/telegram-chat-hider-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk.reproducibility.sha256 "release-apk/telegram-chat-hider-${GITHUB_REF_NAME}.apk.reproducibility.sha256"
          cd release-apk
          sha256sum "telegram-chat-hider-${GITHUB_REF_NAME}.apk" > "telegram-chat-hider-${GITHUB_REF_NAME}.apk.sha256"

      - name: Upload signed release APK
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-apk
          path: release-apk/*
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: write
    steps:
      - name: Download signed APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-apk
          path: release-apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: release-apk/*
          generate_release_notes: true
          fail_on_unmatched_files: true
